name: production-data-and-ml-systems

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DOCKER_DB_PORT:-5433}:5432"
    volumes:
      - citibike_postgres_data:/var/lib/postgresql
      - ./sql/001_create_citibike_raw_tables.sql:/docker-entrypoint-initdb.d/001_create_citibike_raw_tables.sql:ro
      - ./sql/002_create_citibike_staging_tables.sql:/docker-entrypoint-initdb.d/002_create_citibike_staging_tables.sql:ro
      - ./sql/003_create_pipeline_run_table.sql:/docker-entrypoint-initdb.d/003_create_pipeline_run_table.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
      - ./data/raw:/app/data/raw:ro
    command:
      - python
      - -m
      - bike_share_etl.check_database_connection

volumes:
  citibike_postgres_data:
