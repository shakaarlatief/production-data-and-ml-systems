[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "production-data-and-ml-systems"
version = "0.1.0"
description = "Learning and portfolio implementations for production data and machine-learning systems."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
